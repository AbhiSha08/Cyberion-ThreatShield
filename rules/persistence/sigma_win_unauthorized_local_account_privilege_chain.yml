title: Unauthorized Local Account Creation and Administrators Group Escalation Chain
id: ccb8c702-8a68-48a5-b2c7-9a80c6e7491a
status: stable
description: |
  Detects a high-risk privilege escalation and persistence pattern where a new local user
  account is created (EventID 4720) followed immediately by addition of that account to
  the local Administrators security group (EventID 4732) within a 5-minute timeframe.
  Adversaries establish local administrative backdoors (T1136.001 / T1098) to retain
  elevated access independently of domain account revocations. Campaign context: rogue
  account 'support_adm' was created and elevated to local Administrators on WS-FIN-04.
author: Abhijeet Amarnath Sharma - Cyberion Detection Engineering
date: 2026/08/15
references:
  - https://attack.mitre.org/techniques/T1136/001/
  - https://attack.mitre.org/techniques/T1098/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4720
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4732
tags:
  - attack.persistence
  - attack.t1136.001
  - attack.privilege_escalation
  - attack.t1098
logsource:
  product: windows
  service: security
detection:
  selection_create:
    EventID: 4720
  selection_group:
    EventID: 4732
  timeframe: 5m
  condition: 1 of selection_*
falsepositives:
  - IT helpdesk onboarding workflows using unscripted manual local admin creation
  - Automated deployment software (SCCM/Intune) creating local management accounts during workstation provisioning
level: critical
level_rationale: >
  Critical severity because unmanaged local administrator creation represents an immediate
  and complete compromise of host integrity. This pattern directly grants permanent administrative
  persistence that circumvents standard domain-level monitoring and PAM controls.
