title: Linux SSH Password Spray and Shadow File Credential Access
id: 034b2474-e370-4595-b27f-76d8daa7e600
status: stable
description: |
  Detects credential access attempts on Linux hosts via SSH password spraying (T1110.003)
  or direct attempts to read the local password hash database /etc/shadow (T1003.008 - OS
  Credential Dumping: /etc/passwd and /etc/shadow). The rule matches auth.log SSH authentication
  failures across multiple accounts and auditd system call logs monitoring open access to
  /etc/shadow. Campaign context: external attacker sprayed 8 usernames via SSH and attempted
  to read /etc/shadow using cat on SRV-DB-01.
author: Abhijeet Amarnath Sharma - Cyberion Detection Engineering
date: 2026/08/15
references:
  - https://attack.mitre.org/techniques/T1110/003/
  - https://attack.mitre.org/techniques/T1003/008/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/lnx_auditd_etc_shadow_access.yml
tags:
  - attack.credential_access
  - attack.t1110.003
  - attack.t1003.008
logsource:
  product: linux
  service: auth
detection:
  selection_ssh_spray:
    program: 'sshd'
    message|contains: 'Failed password'
  selection_shadow_auditd:
    name|contains: '/etc/shadow'
  selection_shadow_key:
    key: 'shadow_access'
  condition: 1 of selection_*
falsepositives:
  - Legitimate users failing password authentication multiple times before success
  - Backup tools or configuration compliance scanners (e.g., Lynis, CIS-CAT) verifying /etc/shadow permissions
level: high
level_rationale: >
  High severity because SSH brute-forcing directly seeks initial or lateral shell access,
  while unauthorized attempts to inspect /etc/shadow seek the root password hash for offline
  cracking. Both activities represent direct credential extraction attacks.
